<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">
  <defs>
    <linearGradient id="degradadoDesde40" x1="0%" y1="0%" x2="0%" y2="100%">
      <!-- Inicia con el verde claro -->
      <stop offset="0%" style="stop-color:#7a8f6d; stop-opacity:1" />
      <!-- Mantiene el verde claro totalmente sólido hasta el 40% -->
      <stop offset="40%" style="stop-color:#7a8f6d; stop-opacity:1" />
      <!-- A partir del 40% empieza a transformarse hasta llegar al oscuro en el 100% -->
      <stop offset="100%" style="stop-color:#242920; stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#degradadoDesde40)" />
</svg>
